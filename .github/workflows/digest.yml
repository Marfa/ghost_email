name: Weekly digest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run digest
        env:
          GHOST_URL: ${{ secrets.GHOST_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TEXT_MODEL: ${{ secrets.HF_TEXT_MODEL }}
          HF_BASE_URL: ${{ secrets.HF_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_BASE_URL: ${{ secrets.GROQ_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update digest last-run timestamp'
          file_pattern: state/last-run.json
