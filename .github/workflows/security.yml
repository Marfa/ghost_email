name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  npm-audit:
    # Pin until ready for Ubuntu 26 (ubuntu-latest migrates Oct 2026).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      # Fail on high+ (not only critical) so known advisories cannot land unnoticed.
      - run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
